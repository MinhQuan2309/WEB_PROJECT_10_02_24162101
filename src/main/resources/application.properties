spring.application.name=WEB_PROJECT_10_02_24162101
server.port=8006

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ket noi database (SQL Server) - tao database truoc bang file database.sql
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=jwt_nimbus;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Sa@123456}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
